version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # ramencloud/* releases reach consumers on release day (FF-7208).
    # Other actions keep the 3-day cooldown.
    cooldown:
      default-days: 3
      exclude:
        - "ramencloud/*"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "ramencloud/*"
    # Pinned @main, no version tags. Dependabot cannot clone those private
    # repos (git_dependencies_not_reachable) and that aborts the grouped bump.
    ignore:
      - dependency-name: "ramencloud/*"
